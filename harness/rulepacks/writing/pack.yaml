description: "General editorial writing rules for any publication kind (ADR-024): abstract scope, citation placement, conclusion placement, narrative depth, section substance, figure explanation. Presentation rules never hard-block (ADR-022); narrative depth is a substance warning (ADR-023). Draft until the author confirms the thresholds. No applies_when — always on; a venue/type pack may override a threshold by the same key at a higher layer."
